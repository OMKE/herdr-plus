name: HerdrIOS
options:
  bundleIdPrefix: io.github.herdr-ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  HerdrKit:
    path: ../Packages/HerdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
targets:
  HerdrIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: HerdrKit
        product: HerdrKit
      - package: HerdrKit
        product: HerdrSSH
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Herdr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - HackNerdFontMono-Regular.ttf
          - HackNerdFontMono-Bold.ttf
          - MesloLGSNF-Regular.ttf
          - MesloLGSNF-Bold.ttf
        NSMicrophoneUsageDescription: Herdr listens only while you hold the mic button, to dictate a message to your agent.
        NSSpeechRecognitionUsageDescription: Herdr turns your dictation into text, on this phone when it can.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.herdr-ios.app.refresh
        NSLocalNetworkUsageDescription: Herdr looks for Macs with Remote Login on your network and connects to your Mac over SSH.
        NSBonjourServices:
          - _ssh._tcp
          - _sftp-ssh._tcp
        LSApplicationQueriesSchemes:
          - tailscale
          - ntfy
        CFBundleURLTypes:
          - CFBundleURLName: io.github.herdr-ios.app
            CFBundleURLSchemes:
              - herdr-ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.herdr-ios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ENABLE_PREVIEWS: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      testTargets:
        - HerdrIOSUITests
  HerdrIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HerdrIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.herdr-ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: HerdrIOS
